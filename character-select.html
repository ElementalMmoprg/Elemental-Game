<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Online — Seleção de Personagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-deep:#7a6435; --gold:#bfa15f; --gold-bright:#f0d38a;
    --glass-1:rgba(22,18,13,.72); --glass-2:rgba(9,7,5,.86);
    --ink:#f2e8d0; --ink-dim:#a99872; --err:#c9455a; --ok:#7fae5e;
    --font-display:'Cinzel', serif; --font-body:'Spectral', serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; font-family:var(--font-body); color:var(--ink); overflow:hidden; }
  body{
    height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 900px 600px at 25% 20%, rgba(191,161,95,.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 80% 85%, rgba(90,60,20,.10), transparent 55%),
      #050403;
  }
  .glass{
    background:linear-gradient(180deg, var(--glass-1), var(--glass-2));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--gold); border-radius:10px;
    box-shadow:0 0 0 1px rgba(191,161,95,.14) inset, 0 20px 60px rgba(0,0,0,.6);
  }
  #top-bar{ position:absolute; top:18px; left:0; right:0; display:flex; justify-content:space-between; padding:0 24px; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); }
  #top-bar b{ color:var(--gold-bright); }
  #logout-link{ color:var(--err); cursor:pointer; }

  h1.title{ font-family:var(--font-display); font-size:20px; letter-spacing:.1em; color:var(--gold-bright); text-transform:uppercase; text-align:center; margin:0 0 22px; text-shadow:0 0 14px rgba(240,211,138,.3); }

  /* ---------- Seleção de personagem (estilo Ragnarok: slots em carrossel + painel de status) ---------- */
  #char-select-view{ width:640px; padding:28px 30px; }
  .char-slots-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:20px; }
  .slot-arrow{ width:36px; height:36px; border-radius:50%; border:1px solid var(--gold-deep); background:rgba(0,0,0,.3); color:var(--gold-bright); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .slot-arrow:hover{ border-color:var(--gold-bright); }
  .slot-arrow:disabled{ opacity:.25; cursor:not-allowed; }
  .char-slots{ display:flex; gap:12px; }
  .char-slot{
    width:110px; height:150px; border-radius:8px; border:1px solid var(--gold-deep);
    background:radial-gradient(ellipse at 50% 30%,#201808,#0a0704 75%); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative;
    transition:border-color .15s, transform .15s; opacity:.6;
  }
  .char-slot:hover{ opacity:.85; }
  .char-slot.selected{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright) inset, 0 0 14px rgba(240,211,138,.25); opacity:1; transform:translateY(-4px); }
  .char-slot .select-tag{ position:absolute; top:6px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:var(--gold-bright); background:rgba(0,0,0,.5); padding:2px 7px; border-radius:9px; display:none; }
  .char-slot.selected .select-tag{ display:block; }
  .char-slot .slot-nick{ font-family:var(--font-display); font-size:11.5px; color:var(--ink); padding:5px 0; text-align:center; width:100%; background:rgba(0,0,0,.35); }
  .char-slot.empty{ cursor:default; display:flex; align-items:center; justify-content:center; opacity:.35; }
  .char-slot.empty .plus{ font-size:26px; color:var(--ink-dim); }

  .status-panel{ display:flex; gap:0; border:1px solid var(--gold-deep); border-radius:8px; overflow:hidden; background:rgba(0,0,0,.22); }
  .status-col{ flex:1; padding:12px 16px; }
  .status-col + .status-col{ border-left:1px solid rgba(191,161,95,.25); }
  .status-row{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; padding:3px 0; }
  .status-row span:first-child{ color:var(--ink-dim); }
  .status-row span:last-child{ color:var(--gold-bright); }
  .status-row.big span:last-child{ font-family:var(--font-display); font-size:14px; color:var(--gold-bright); }

  #connect-btn{
    width:100%; margin-top:16px; padding:13px; border-radius:6px; border:1px solid var(--gold-bright);
    background:linear-gradient(180deg,#4a3a1e,#2c2115); color:var(--gold-bright); font-family:var(--font-display);
    font-size:14px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  #connect-btn:hover{ filter:brightness(1.15); }
  #connect-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #new-char-link{ display:block; text-align:center; margin-top:12px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
  #new-char-link:hover{ color:var(--gold-bright); }

  /* ---------- Criação de personagem: tela ÚNICA (substitui de vez a antiga
     tela em 2 passos com a grade grande de retratos de penteado, estilo
     Ragnarok, que o jogador pediu pra remover). Gênero + nick + cabelo (com
     grade de cor, mantida a pedido do jogador) ficam compactos à esquerda;
     a escolha de Arquétipo -- as 8 classes reais do Ravendawn, com detalhe
     de cada uma antes de decidir -- é o elemento principal à direita. */
  #char-create-view{ width:760px; padding:26px 30px; display:none; }
  .create-layout{ display:flex; gap:22px; }
  .create-left{ width:170px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:12px; }
  #create-preview{ width:150px; height:190px; background:radial-gradient(ellipse at 50% 30%,#201808,#0a0704 75%); border:1px solid var(--gold-deep); border-radius:8px; }
  .toggle-row{ display:flex; gap:8px; width:100%; }
  .toggle-btn{
    flex:1; padding:9px; text-align:center; border-radius:6px; border:1px solid var(--gold-deep);
    background:rgba(0,0,0,.3); color:var(--ink-dim); font-family:var(--font-display); font-size:11px;
    letter-spacing:.04em; cursor:pointer; text-transform:uppercase;
  }
  .toggle-btn.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:rgba(191,161,95,.12); box-shadow:0 0 10px rgba(240,211,138,.2); }
  .field{ width:100%; }
  .field label{ display:block; font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-bottom:5px; letter-spacing:.03em; }
  .field input{
    width:100%; background:#140f0a; border:1px solid #3a2f1f; border-radius:5px; color:var(--ink);
    padding:9px 10px; font-family:var(--font-body); font-size:13px; outline:none;
  }
  .field input:focus{ border-color:var(--gold-bright); }

  .create-right{ flex:1; min-width:0; }
  .section-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em; margin:0 0 7px; text-transform:uppercase; }
  .hairstyle-cycler{ display:flex; align-items:center; gap:8px; }
  .hairstyle-cycler canvas{ width:40px; height:40px; image-rendering:pixelated; border:1px solid var(--gold-deep); border-radius:6px; background:rgba(0,0,0,.3); flex-shrink:0; }
  .hairstyle-arrow{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--gold-deep); background:rgba(0,0,0,.3);
    color:var(--gold-bright); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:12px; flex-shrink:0;
  }
  .hairstyle-arrow:hover{ border-color:var(--gold-bright); }
  .hairstyle-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); flex:1; text-align:center; }
  #hair-color-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .preview-archetype-tag{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); text-align:center; min-height:14px; }
  .hair-color-dot{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .hair-color-dot.active{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright), 0 0 8px rgba(240,211,138,.5); }

  #create-btn{
    width:100%; margin-top:6px; padding:13px; border-radius:6px; border:1px solid var(--gold-bright);
    background:linear-gradient(180deg,#4a3a1e,#2c2115); color:var(--gold-bright); font-family:var(--font-display);
    font-size:14px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  #create-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #back-to-select-link{ display:block; text-align:center; margin-top:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
  #back-to-select-link:hover{ color:var(--gold-bright); }
  .nav-link{ display:block; text-align:center; margin-top:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
  .nav-link:hover{ color:var(--gold-bright); }
  /* ---------- Escolha de Arquétipo (8 classes reais do Ravendawn --
     Holy/Warfare/Archery/Protection/Shadow/Spiritual/Wizardry/Witchcraft) --
     é o elemento PRINCIPAL da tela de criação agora (pedido do jogador: "de
     uma forma que o jogador consiga verificar os detalhes de cada arquétipo,
     antes de escolher"). Grade com ícone+tema por card, painel de detalhe
     com a descrição real e 3 magias de destaque de cada um; o retrato único
     à esquerda (ver #create-preview) já desenha o traje do arquétipo em
     foco por cima do corpo/cabelo escolhidos, mesmo motor de recolorir
     usado no mundo (ver getRecoloredArmor). ---------- */
  .archetype-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:9px; align-content:start; margin-bottom:14px; }
  .archetype-card{
    border:1px solid var(--gold-deep); border-radius:8px; background:rgba(0,0,0,.3); cursor:pointer;
    padding:9px 4px 7px; display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center;
  }
  .archetype-card img{ width:34px; height:34px; image-rendering:pixelated; }
  .archetype-card .arch-name{ font-family:var(--font-display); font-size:10.5px; color:var(--ink); line-height:1.2; }
  .archetype-card .arch-theme{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-dim); }
  .archetype-card:hover{ border-color:var(--gold-bright); }
  .archetype-card.selected{ border-color:var(--gold-bright); background:rgba(191,161,95,.14); box-shadow:0 0 0 1px var(--gold-bright) inset, 0 0 10px rgba(240,211,138,.25); }
  .archetype-detail{ border:1px solid var(--gold-deep); border-radius:8px; background:rgba(0,0,0,.22); padding:12px 16px; min-height:140px; }
  .archetype-detail-empty{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); text-align:center; padding:36px 0; }
  .arch-detail-title{ font-family:var(--font-display); font-size:15px; color:var(--gold-bright); }
  .arch-detail-role{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin:2px 0 8px; letter-spacing:.03em; text-transform:uppercase; }
  .arch-detail-desc{ font-family:var(--font-body); font-size:12.5px; line-height:1.5; color:var(--ink); margin-bottom:10px; }
  .arch-detail-spells-label{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .arch-spell-row{ margin-bottom:6px; }
  .arch-spell-name{ font-family:var(--font-mono); font-size:11px; color:var(--gold-bright); }
  .arch-spell-kind{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-dim); margin-left:6px; }
  .arch-spell-desc{ font-family:var(--font-body); font-size:11px; color:var(--ink-dim); line-height:1.4; }
  .outfit-color-group{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .outfit-color-label{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); width:42px; flex-shrink:0; }
  .outfit-color-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .outfit-color-dot{ width:19px; height:19px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .outfit-color-dot.active{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright), 0 0 8px rgba(240,211,138,.5); }

  .msg{ font-family:var(--font-mono); font-size:11.5px; padding:9px 10px; border-radius:5px; margin-bottom:14px; display:none; }
  .msg.show{ display:block; }
  .msg.error{ background:rgba(201,69,90,.12); border:1px solid var(--err); color:#ef9aa5; }
  .msg.ok{ background:rgba(127,174,94,.12); border:1px solid var(--ok); color:#b9dba0; }

  #loading-view{ font-family:var(--font-mono); color:var(--ink-dim); font-size:12px; }
</style>
</head>
<body>

<div id="top-bar">
  <span>Conta: <b id="account-name">—</b></span>
  <span id="logout-link">Sair</span>
</div>

<div id="loading-view">Carregando personagens...</div>

<!-- TEM PERSONAGEM: carrossel de slots + painel de status, estilo Ragnarok -->
<div id="char-select-view" class="glass" style="display:none;">
  <h1 class="title">Seleção de Personagem</h1>
  <div class="char-slots-row">
    <button class="slot-arrow" id="slots-prev">◀</button>
    <div class="char-slots" id="char-slots"></div>
    <button class="slot-arrow" id="slots-next">▶</button>
  </div>
  <div class="status-panel" id="status-panel"></div>
  <button id="connect-btn" disabled>Conectar</button>
  <div id="new-char-link">+ Criar novo herói</div>
</div>

<!-- SEM PERSONAGEM (ou criando um novo): tela ÚNICA de criação. A antiga
     tela (grade grande de retratos de penteado, estilo Ragnarok) foi
     removida por completo -- gênero, nick e cabelo (com grade de cor,
     mantida a pedido do jogador) ficam compactos à esquerda; a escolha de
     Arquétipo -- as 8 classes reais do Ravendawn, com detalhe de cada uma
     antes de decidir -- é o elemento principal à direita. -->
<div id="char-create-view" class="glass">
  <h1 class="title">Criação de Personagem</h1>
  <div class="msg" id="create-msg"></div>

  <div class="create-layout">
    <div class="create-left">
      <canvas id="create-preview" width="150" height="190"></canvas>
      <div class="preview-archetype-tag" id="preview-archetype-tag">Escolha um arquétipo →</div>
      <div class="toggle-row" id="gender-toggle">
        <div class="toggle-btn active" data-gender="male">♂ Masc.</div>
        <div class="toggle-btn" data-gender="female">♀ Fem.</div>
      </div>
      <div class="field">
        <label>Nick (apelido único do herói)</label>
        <input type="text" id="nick-input" maxlength="20" placeholder="Ex: Kael">
      </div>
      <div class="field">
        <label>Penteado</label>
        <div class="hairstyle-cycler">
          <div class="hairstyle-arrow" id="hairstyle-prev">◀</div>
          <canvas id="hairstyle-preview" width="40" height="40"></canvas>
          <div class="hairstyle-label" id="hairstyle-label">1/19</div>
          <div class="hairstyle-arrow" id="hairstyle-next">▶</div>
        </div>
      </div>
      <div class="field">
        <label>Cor do Cabelo</label>
        <div id="hair-color-row"></div>
      </div>
    </div>
    <div class="create-right">
      <div class="section-label">Arquétipo — escolha sua classe</div>
      <div class="archetype-grid" id="archetype-grid"></div>
      <div class="archetype-detail" id="archetype-detail">
        <div class="archetype-detail-empty">Clique num arquétipo pra ver os detalhes antes de escolher.</div>
      </div>
      <div class="outfit-colors-block" id="outfit-colors-block" style="display:none;">
        <div class="section-label" style="margin-top:12px;">Cor do Traje</div>
        <div class="outfit-color-group">
          <span class="outfit-color-label">Blusa</span>
          <div class="outfit-color-row" id="outfit-color-body"></div>
        </div>
        <div class="outfit-color-group">
          <span class="outfit-color-label">Calça</span>
          <div class="outfit-color-row" id="outfit-color-legs"></div>
        </div>
        <div class="outfit-color-group">
          <span class="outfit-color-label">Bota</span>
          <div class="outfit-color-row" id="outfit-color-feet"></div>
        </div>
      </div>
    </div>
  </div>
  <button id="create-btn" disabled>Criar Personagem</button>
  <div id="back-to-select-link" class="nav-link" style="display:none;">← Voltar pra seleção</div>
</div>

<script>
(function(){
  "use strict";
  // Backend oficial no Render — fixo, não detectado por location.origin.
  const API_BASE = (/^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(window.location.hostname)) ? `http://${window.location.hostname}:8787` : 'https://elemental-server.onrender.com';
  // Repositório oficial de artes/sprites no GitHub Pages — fixo character by character.
  const URL_BASE = 'https://elementalmmoprg.github.io/Elemental_assets/assets/';

  const LS_TOKEN = 'elemental_token';
  const LS_USERNAME = 'elemental_username';
  const LS_CHARACTER = 'elemental_character';

  const token = localStorage.getItem(LS_TOKEN);
  const username = localStorage.getItem(LS_USERNAME);
  if(!token || !username){ window.location.href = 'index.html'; return; }
  document.getElementById('account-name').textContent = username;

  document.getElementById('logout-link').addEventListener('click', ()=>{
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USERNAME);
    localStorage.removeItem(LS_CHARACTER);
    window.location.href = 'index.html';
  });

  async function api(path, opts={}){
    const res = await fetch(API_BASE+path, {
      ...opts,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, ...(opts.headers||{}) },
    });
    let data; try{ data = await res.json(); }catch(e){ data = { ok:false, error:'resposta_invalida' }; }
    return data;
  }

  /* =========================================================
     SPRITE MANAGER — mesma técnica de world-prototype.html (mirror
     reduzido: só corpo + cabeça, é tudo que essa tela precisa).
     ver comentários grandões lá pra explicação completa de cada peça.
     ========================================================= */
  // 8 cores reais (mirror de huntEngine.HAIR_COLORS — cada uma é um arquivo
  // player/heads <gênero>/<cor>.png de verdade, confirmado nos dois gêneros)
  // e 19 penteados reais por arquivo (mirror de huntEngine.HAIR_STYLE_COUNT
  // — linhas do atlas). HAIR_COLOR_RGB abaixo é só um tom aproximado pra
  // pintar a bolinha da paleta na UI — a cor de verdade vem do PNG certo.
  const HAIR_COLOR_NAMES = ['black','blue','brown','green','purple','red','white','yellow'];
  const HAIR_COLOR_RGB = { black:[42,33,24], blue:[58,95,160], brown:[138,90,42], green:[63,155,74], purple:[122,63,160], red:[201,64,64], white:[232,226,208], yellow:[216,194,58] };
  const HAIR_COLOR_LABEL = { black:'Preto', blue:'Azul', brown:'Castanho', green:'Verde', purple:'Roxo', red:'Vermelho', white:'Branco', yellow:'Loiro' };
  const HAIR_STYLE_COUNT = 19;

  const SpriteManager = (function(){
    const cache = {};
    function computeAutoFrame(img){
      try{
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h) return null;
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const cx = c.getContext('2d'); cx.drawImage(img,0,0);
        const data = cx.getImageData(0,0,w,h).data;
        function isBg(x,y){ const i=(y*w+x)*4, a=data[i+3]; if(a<10) return true; const r=data[i],g=data[i+1],b=data[i+2]; return (r>235&&g>235&&b>235); }
        function rowHas(y,x0,x1){ for(let x=x0;x<x1;x++){ if(!isBg(x,y)) return true; } return false; }
        function colHas(x,y0,y1){ for(let y=y0;y<y1;y++){ if(!isBg(x,y)) return true; } return false; }
        let y0=-1; for(let y=0;y<h;y++){ if(rowHas(y,0,w)){ y0=y; break; } }
        if(y0<0) return null;
        let y1=y0; for(let y=y0;y<h;y++){ if(rowHas(y,0,w)) y1=y; else break; } y1++;
        let x0=-1; for(let x=0;x<w;x++){ if(colHas(x,y0,y1)){ x0=x; break; } }
        if(x0<0) return null;
        let x1=x0; for(let x=x0;x<w;x++){ if(colHas(x,y0,y1)) x1=x; else break; } x1++;
        const pad=3, sx=Math.max(0,x0-pad), sy=Math.max(0,y0-pad);
        return { sx, sy, sw:Math.min(w-sx,(x1-x0)+pad*2), sh:Math.min(h-sy,(y1-y0)+pad*2) };
      }catch(e){ return null; }
    }
    function computeHeadStyleFrames(img){
      try{
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w||!h) return [];
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const cx = c.getContext('2d'); cx.drawImage(img,0,0);
        const data = cx.getImageData(0,0,w,h).data;
        function isBg(x,y){ const i=(y*w+x)*4, a=data[i+3]; if(a<10) return true; const r=data[i],g=data[i+1],b=data[i+2]; return (r>235&&g>235&&b>235); }
        function rowHas(y){ for(let x=0;x<w;x++){ if(!isBg(x,y)) return true; } return false; }
        function colHas(x,y0,y1){ for(let y=y0;y<y1;y++){ if(!isBg(x,y)) return true; } return false; }
        // largura de conteúdo (nº de colunas não-fundo) da linha y, restrita a
        // [x0,x1) — usada abaixo pra achar o "queixo" de cada penteado (ver
        // comentário perto de chinY mais embaixo).
        function rowWidth(y,x0,x1){ let n=0; for(let x=x0;x<x1;x++){ if(!isBg(x,y)) n++; } return n; }
        const bands=[]; let y=0;
        while(y<h){ if(rowHas(y)){ const y0=y; let y1=y; while(y1<h && rowHas(y1)) y1++; bands.push([y0,y1]); y=y1; } else y++; }
        const pad=3;
        return bands.map(([y0,y1])=>{
          let x0=-1; for(let x=0;x<w;x++){ if(colHas(x,y0,y1)){ x0=x; break; } }
          if(x0<0) return null;
          let x1=x0; for(let x=x0;x<w;x++){ if(colHas(x,y0,y1)) x1=x; else break; } x1++;
          // O bbox bruto (y0..y1) inclui fiapo de cabelo/enfeite que desça
          // bem abaixo do rosto (mecha solta, pingente) — cada penteado tem
          // uma proporção diferente disso, então usar o fundo do bbox como
          // referência de encaixe (como era antes) deixa o rosto flutuando
          // bem mais alto em penteados com fiapo comprido do que nos sem.
          // Em vez disso achamos a última linha "larga" (bochecha/queixo, a
          // parte grossa da cabeça, >=40% da largura máxima) — é ela
          // (chinY) que encosta no corpo; o fiapo fino abaixo continua
          // desenhado por cima do pescoço (efeito certo de cabelo caindo no
          // ombro), só não serve de referência de altura.
          let maxRowW=0;
          for(let yy=y0; yy<y1; yy++){ const rw=rowWidth(yy,x0,x1); if(rw>maxRowW) maxRowW=rw; }
          const thresh = maxRowW*0.4;
          let chinY = y1-1;
          for(let yy=y1-1; yy>=y0; yy--){ if(rowWidth(yy,x0,x1) >= thresh){ chinY=yy; break; } }
          const sx=Math.max(0,x0-pad), sy=Math.max(0,y0-pad);
          return { sx, sy, sw:Math.min(w-sx,(x1-x0)+pad*2), sh:Math.min(h-sy,(y1-y0)+pad*2), chinY };
        }).filter(Boolean);
      }catch(e){ return []; }
    }
    // Atlas de outfit de Arquétipo (player/outfits_template/<id>_base|mask.png)
    // é gerado por script numa grade FIXA de 3 linhas (baixo/cima/direita) x
    // células de 64px cada (outfit w=2,h=2 já composto) -- SEM garantia de
    // margem transparente entre quadros vizinhos, ao contrário do atlas de
    // corpo/cabeça feito à mão. A pose real desses outfits (agachada,
    // segurando arma erguida) chega perto o bastante da borda da célula pra
    // grudar visualmente no quadro ao lado quando o recorte é feito por
    // DETECÇÃO DE CONTEÚDO (computeAutoFrame, que espera uma linha/coluna
    // totalmente vazia separando um quadro do outro) -- 2+ quadros/direções
    // acabavam lidos como 1 só, aparecendo misturados/borrados no retrato
    // (relatado pelo usuário como "erros brancos"). Corte por GRADE FIXA
    // resolve isso, já que a geometria é conhecida de antemão.
    function computeOutfitCellFrames(img){
      const w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return null;
      const rows = 3, cell = Math.round(h/rows) || 64;
      const cols = Math.max(1, Math.round(w/cell));
      const dirNames = ['down','up','right'];
      const out = {};
      dirNames.forEach((name, rowIdx)=>{
        const frames = [];
        for(let c=0;c<cols;c++) frames.push({ sx:c*cell, sy:rowIdx*cell, sw:cell, sh:cell });
        out[name] = frames;
      });
      return out;
    }
    function load(key, relPath){
      if(cache[key]) return cache[key];
      const entry = { img:new Image(), loaded:false, failed:false, frame:null, styleFrames:null };
      entry.img.crossOrigin = 'anonymous';
      entry.img.onload = ()=>{
        entry.loaded=true;
        const isArchetypeOutfitAtlas = key.charAt(0)==='a' && key.charAt(1)==='_' && (key.slice(-5)==='_base' || key.slice(-5)==='_mask');
        if(isArchetypeOutfitAtlas){
          const cellFrames = computeOutfitCellFrames(entry.img);
          entry.frame = cellFrames && cellFrames.down && cellFrames.down[0];
          return;
        }
        entry.frame=computeAutoFrame(entry.img);
        if(key.indexOf('h_')===0) entry.styleFrames=computeHeadStyleFrames(entry.img);
      };
      entry.img.onerror = ()=> entry.failed = true;
      entry.img.src = URL_BASE + relPath;
      cache[key] = entry;
      return entry;
    }
    function bodySprite(gender){ return load('b_'+gender, `player/bodies ${gender}/${gender}_base.png`); }
    // Atlas base+mask de um Arquétipo (ver getRecoloredArmor mais abaixo) --
    // mesma convenção de assets/player/outfits_template/<id>_<kind>.png já
    // usada no mundo (world-prototype.html).
    function outfitTemplateSprite(outfitId, kind){ return load('a_'+outfitId+'_'+kind, `player/outfits_template/${outfitId}_${kind}.png`); }
    // 8 cores reais no repositório pra AMBOS os gêneros hoje (confirmado:
    // player/heads male|female/{black,blue,brown,green,purple,red,white,yellow}.png)
    // — cada arquivo é uma grade de 19 penteados (linhas), não 1 penteado só.
    function headSprite(gender, colorName){ return load('h_'+gender+'_'+colorName, `player/heads ${gender}/${colorName}.png`); }
    function getHeadStyleFrame(entry, styleId){
      if(!entry.loaded) return null;
      const frames = entry.styleFrames;
      if(!frames || !frames.length) return entry.frame;
      const idx = ((Math.floor(Number(styleId)||1)-1) % frames.length + frames.length) % frames.length;
      return frames[idx];
    }
    function drawFrameContainFit(targetCtx, entry, cx, bottomY, maxW, maxH){
      if(!entry.loaded || !entry.frame) return null;
      const f = entry.frame;
      const scale = Math.min(maxW/f.sw, maxH/f.sh);
      const dw=f.sw*scale, dh=f.sh*scale, dx=cx-dw/2, dy=bottomY-dh;
      targetCtx.drawImage(entry.img, f.sx, f.sy, f.sw, f.sh, dx, dy, dw, dh);
      return { dw, dh, dx, dy, topY:dy };
    }
    // Desenha a linha (penteado) certa do atlas já na cor certa (ver
    // headSprite acima) — igual drawFrameContainFit, só recortando a linha
    // hairStyleId em vez do único frame de computeAutoFrame.
    function drawHeadStyleContainFit(targetCtx, entry, styleId, cx, bottomY, maxW, maxH){
      if(!entry.loaded) return null;
      const f = getHeadStyleFrame(entry, styleId);
      if(!f) return null;
      // A ESCALA usa a altura "núcleo" (do topo do recorte até o queixo,
      // f.chinY-f.sy), não a altura crua do recorte inteiro (f.sh) — sh
      // inclui qualquer fiapo/rabo-de-cavalo que desça bem abaixo do
      // queixo, e cada penteado tem uma proporção diferente disso. Medindo
      // a escala pelo sh cru, penteados com fiapo comprido encolhiam a
      // CABEÇA INTEIRA mais que os outros só pra caber o fiapo no mesmo
      // espaço — é exatamente o "cabeça pequena fora do padrão" reportado.
      // Usando só o núcleo (cabeça+cabelo até o queixo), o tamanho aparente
      // da cabeça fica igual pra todo penteado; o fiapo, se sobrar, só
      // desenha mais pra baixo por cima do pescoço/ombro do corpo.
      const coreH = (f.chinY != null ? Math.max(1, f.chinY - f.sy) : f.sh);
      const scale = Math.min(maxW/f.sw, maxH/coreH);
      const dw=f.sw*scale, dh=f.sh*scale, dx=cx-dw/2;
      // Ancora pelo QUEIXO (f.chinY, calculado em computeHeadStyleFrames),
      // não pelo fundo bruto do recorte — ver comentário grandão lá em cima.
      // Frames sem chinY (fallback de computeAutoFrame, só usado se o atlas
      // de penteados ainda não carregou as 19 linhas) caem de volta na base
      // do recorte, igual era antes.
      const chinOffset = (f.chinY != null ? (f.chinY - f.sy) : f.sh) * scale;
      const dy = bottomY - chinOffset;
      targetCtx.drawImage(entry.img, f.sx, f.sy, f.sw, f.sh, dx, dy, dw, dh);
      return { dw, dh, dx, dy, topY:dy };
    }
    return { bodySprite, headSprite, outfitTemplateSprite, getHeadStyleFrame, drawFrameContainFit, drawHeadStyleContainFit };
  })();

  /* =========================================================
     RECOLORIR DE OUTFIT EM TEMPO REAL (mirror reduzido de getRecoloredArmor
     em world-prototype.html — mesmo algoritmo, só aqui pra desenhar o
     retrato de criação já com o traje do arquétipo escolhido, ANTES de
     entrar no mundo). Layer 0 = arte base fixa, layer 1 = máscara de
     template (Cabeça=amarelo/Corpo=vermelho/Pernas=verde/Pés=azul) tingida
     pela paleta de cor — aqui sempre com a cor PADRÃO (índice 0 = branco em
     todas as 4 partes, mesmo default de buildDefaultProgress no servidor),
     já que o jogador ainda não chegou na aba de Cores do Inventário.
     ========================================================= */
  const COSMETIC_COLOR_PALETTE = [
    '#FFFFFF', '#F1D2A9', '#D89B6E', '#9C6B3F', '#5C3A21',
    '#E8C547', '#E2542B', '#C23B3B', '#8B2E5F', '#5B2C87',
    '#3B4FA0', '#2E7DB8', '#2E9E8F', '#3F9B4A', '#6B8F2E',
    '#8A8A8A', '#4A4A4A', '#1E1E1E', '#7A5C3E',
  ];
  const DEFAULT_COSMETIC_COLORS = { head: 0, body: 0, legs: 0, feet: 0 };
  const OUTFIT_COLOR_REGIONS = [['head', 60/360], ['body', 0/360], ['legs', 120/360], ['feet', 240/360]];
  function hexToRgbTriplet(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
    if(!m) return { r:255, g:255, b:255 };
    const n = parseInt(m[1], 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  function rgbToHsvTriplet(r,g,b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0;
    if(d!==0){
      if(max===r) h=((g-b)/d)%6;
      else if(max===g) h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h/=6; if(h<0) h+=1;
    }
    const s = max===0 ? 0 : d/max;
    return { h, s, v:max };
  }
  function hsvToRgbTriplet(h,s,v){
    const i = Math.floor(h*6), f = h*6-i;
    const p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
    let r,g,b;
    switch(i%6){
      case 0: r=v; g=t; b=p; break;
      case 1: r=q; g=v; b=p; break;
      case 2: r=p; g=v; b=t; break;
      case 3: r=p; g=q; b=v; break;
      case 4: r=t; g=p; b=v; break;
      default: r=v; g=p; b=q; break;
    }
    return { r:Math.round(r*255), g:Math.round(g*255), b:Math.round(b*255) };
  }
  function nearestOutfitRegion(h){
    let best=null, bestD=999;
    OUTFIT_COLOR_REGIONS.forEach(([name, rh])=>{
      const d = Math.min(Math.abs(h-rh), 1-Math.abs(h-rh));
      if(d<bestD){ bestD=d; best=name; }
    });
    return best;
  }
  const _recolorCache = {};
  const _recolorCacheOrder = [];
  function getRecoloredArmor(outfitId, colors){
    const c = colors || DEFAULT_COSMETIC_COLORS;
    const key = outfitId+'|'+c.head+','+c.body+','+c.legs+','+c.feet;
    if(_recolorCache[key]) return _recolorCache[key];
    const baseEntry = SpriteManager.outfitTemplateSprite(outfitId, 'base');
    const maskEntry = SpriteManager.outfitTemplateSprite(outfitId, 'mask');
    if(!baseEntry.loaded || !maskEntry.loaded || !baseEntry.frame) return null;
    const w = baseEntry.img.naturalWidth, h = baseEntry.img.naturalHeight;
    if(!w || !h) return null;
    const targetHsv = {};
    ['head','body','legs','feet'].forEach(part=>{
      const rgb = hexToRgbTriplet(COSMETIC_COLOR_PALETTE[c[part]] || COSMETIC_COLOR_PALETTE[0]);
      targetHsv[part] = rgbToHsvTriplet(rgb.r, rgb.g, rgb.b);
    });
    const mc = document.createElement('canvas'); mc.width=w; mc.height=h;
    const mcx = mc.getContext('2d');
    mcx.drawImage(maskEntry.img, 0, 0);
    let imgData;
    try{ imgData = mcx.getImageData(0,0,w,h); } catch(e){ return null; }
    const data = imgData.data;
    for(let i=0;i<data.length;i+=4){
      const a = data[i+3];
      if(a===0) continue;
      const hsv = rgbToHsvTriplet(data[i], data[i+1], data[i+2]);
      if(hsv.s < 0.12) continue;
      const region = nearestOutfitRegion(hsv.h);
      const t = targetHsv[region];
      const nv = Math.max(0, Math.min(1, hsv.v*(0.35+0.65*t.v)));
      const rgb = hsvToRgbTriplet(t.h, t.s, nv);
      data[i]=rgb.r; data[i+1]=rgb.g; data[i+2]=rgb.b;
    }
    mcx.putImageData(imgData, 0, 0);
    const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const cx = canvas.getContext('2d');
    cx.drawImage(baseEntry.img, 0, 0);
    cx.drawImage(mc, 0, 0);
    const entry = { loaded:true, img:canvas, frame:baseEntry.frame };
    _recolorCache[key] = entry;
    _recolorCacheOrder.push(key);
    if(_recolorCacheOrder.length > 20){ delete _recolorCache[_recolorCacheOrder.shift()]; }
    return entry;
  }

  // Composita corpo+cabeça num canvas qualquer (retrato da criação, thumbnail

  // terminou de carregar (load() é assíncrono) ou numa eventual falha de rede.
  function drawCharacterPreview(canvas, gender, hairColorId, hairStyleId, outfitId, colors){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, feetY = h-14;
    ctx.beginPath(); ctx.ellipse(cx, feetY+6, w*0.22, 5, 0,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fill();
    const body = SpriteManager.bodySprite(gender);
    const bodyDraw = SpriteManager.drawFrameContainFit(ctx, body, cx, feetY, w*0.34, h*0.46);
    // Traje do Arquétipo (se algum já foi escolhido) -- mesma camada/ordem de
    // drawCharacterLayers no mundo: cobre o mesmo recorte do corpo. `colors`
    // (Blusa/Calça/Bota) vem do que o jogador escolheu nesta própria tela
    // (ver buildOutfitColorRow) -- cai em DEFAULT_COSMETIC_COLORS (branco)
    // só se ninguém passar nada (compatibilidade com quem ainda chama sem o
    // 6º parâmetro).
    if(outfitId){
      const armor = getRecoloredArmor(outfitId, colors || DEFAULT_COSMETIC_COLORS);
      if(armor) SpriteManager.drawFrameContainFit(ctx, armor, cx, feetY, w*0.34, h*0.46);
    }
    const corCabelo = HAIR_COLOR_NAMES[(Number(hairColorId)||1)-1] || 'black';
    const head = SpriteManager.headSprite(gender, corCabelo);
    const headBottomY = (bodyDraw ? bodyDraw.topY : feetY - h*0.30) + h*0.045;
    const headDraw = SpriteManager.drawHeadStyleContainFit(ctx, head, hairStyleId||1, cx, headBottomY, w*0.26, w*0.26);
    if(!bodyDraw){
      ctx.fillStyle = gender==='female' ? '#8a4a6a' : '#5a6b8a';
      ctx.fillRect(cx-w*0.1, feetY-h*0.32, w*0.2, h*0.2);
      ctx.fillRect(cx-w*0.08, feetY-h*0.14, w*0.06,h*0.14); ctx.fillRect(cx+w*0.02, feetY-h*0.14, w*0.06,h*0.14);
    }
    if(!headDraw){
      ctx.beginPath(); ctx.arc(cx, headBottomY - w*0.09, w*0.09, 0, Math.PI*2); ctx.fillStyle='#e0b98a'; ctx.fill();
      ctx.fillStyle = HAIR_COLOR_RGB[corCabelo] ? `rgb(${HAIR_COLOR_RGB[corCabelo].join(',')})` : '#2a2118';
      ctx.beginPath(); ctx.arc(cx, headBottomY - w*0.11, w*0.095, Math.PI, Math.PI*2); ctx.fill();
    }
  }
  // Redesenha qualquer canvas que ainda dependa de um sprite que não tinha
  // carregado a tempo do primeiro desenho (load() é assíncrono) — cada
  // chamador registra sua própria função de redesenho aqui.
  const pendingRedraws = [];
  function scheduleRedraw(fn){ pendingRedraws.push(fn); }
  setInterval(()=>{ pendingRedraws.forEach(fn=>fn()); }, 300);

  /* =========================================================
     CARREGA OS PERSONAGENS DA CONTA
     ========================================================= */
  async function loadCharacters(){
    const data = await api('/api/characters');
    document.getElementById('loading-view').style.display = 'none';
    if(!data.ok || !data.characters || data.characters.length === 0){
      document.getElementById('char-create-view').style.display = 'block';
      setupCreateView(false);
      return;
    }
    setupSelectView(data.characters);
  }

  /* =========================================================
     SELEÇÃO — carrossel de slots (estilo Ragnarok) + painel de status
     ========================================================= */
  function setupSelectView(characters){
    const view = document.getElementById('char-select-view');
    view.style.display = 'block';
    const slotsWrap = document.getElementById('char-slots');
    const statusPanel = document.getElementById('status-panel');
    const VISIBLE = 3;
    let windowStart = 0;
    let selectedIdx = 0;

    function fmtPct(cur, max){ return max ? Math.round(cur/max*100) : 0; }

    function renderStatus(c){
      const p = c.progress || {};
      const stars = (p.prestige && (p.prestige.bronzeStars+p.prestige.silverStars+p.prestige.goldStars)) || 0;
      statusPanel.innerHTML = `
        <div class="status-col">
          <div class="status-row big"><span>Nome</span><span>${c.nick}</span></div>
          <div class="status-row"><span>Gênero</span><span>${c.gender==='female'?'Feminino':'Masculino'}</span></div>
          <div class="status-row"><span>Nível</span><span>${c.level||1}</span></div>
          <div class="status-row"><span>Estrelas</span><span>${'★'.repeat(stars)||'—'}</span></div>
        </div>
        <div class="status-col">
          <div class="status-row"><span>HP</span><span>${p.hp!=null?`${Math.floor(p.hp)}/${p.hpMax}`:'—'}</span></div>
          <div class="status-row"><span>MP</span><span>${p.mp!=null?`${Math.floor(p.mp)}/${p.mpMax}`:'—'}</span></div>
          <div class="status-row"><span>Gold</span><span>${p.gold!=null?p.gold.toLocaleString('pt-BR'):'—'}</span></div>
          <div class="status-row"><span>XP</span><span>${p.xp!=null?p.xp.toLocaleString('pt-BR'):'—'}</span></div>
        </div>
      `;
    }

    function renderSlots(){
      slotsWrap.innerHTML = '';
      const visibleChars = characters.slice(windowStart, windowStart+VISIBLE);
      visibleChars.forEach((c, i)=>{
        const realIdx = windowStart+i;
        const slot = document.createElement('div');
        slot.className = 'char-slot' + (realIdx===selectedIdx ? ' selected' : '');
        slot.innerHTML = `<span class="select-tag">Select</span><canvas width="90" height="115"></canvas><div class="slot-nick">${c.nick}</div>`;
        slot.addEventListener('click', ()=>{ selectedIdx = realIdx; renderSlots(); renderStatus(characters[selectedIdx]); });
        slotsWrap.appendChild(slot);
        const canvas = slot.querySelector('canvas');
        const draw = ()=> drawCharacterPreview(canvas, c.gender, c.hairId, c.hairStyleId);
        draw(); scheduleRedraw(draw);
      });
      // preenche slots vazios até completar VISIBLE, igual à referência (3 caixas fixas)
      for(let i=visibleChars.length; i<VISIBLE; i++){
        const slot = document.createElement('div');
        slot.className = 'char-slot empty';
        slot.innerHTML = `<span class="plus">+</span>`;
        slotsWrap.appendChild(slot);
      }
      document.getElementById('slots-prev').disabled = windowStart <= 0;
      document.getElementById('slots-next').disabled = windowStart+VISIBLE >= characters.length;
    }

    document.getElementById('slots-prev').addEventListener('click', ()=>{ windowStart = Math.max(0, windowStart-VISIBLE); renderSlots(); });
    document.getElementById('slots-next').addEventListener('click', ()=>{ if(windowStart+VISIBLE < characters.length){ windowStart += VISIBLE; renderSlots(); } });

    renderSlots();
    renderStatus(characters[selectedIdx]);

    document.getElementById('connect-btn').disabled = false;
    document.getElementById('connect-btn').addEventListener('click', ()=>{
      localStorage.setItem(LS_CHARACTER, JSON.stringify(characters[selectedIdx]));
      window.location.href = 'world-prototype.html';
    });
    document.getElementById('new-char-link').addEventListener('click', ()=>{
      view.style.display = 'none';
      document.getElementById('char-create-view').style.display = 'block';
      document.getElementById('back-to-select-link').style.display = 'block';
      setupCreateView(true);
    });
  }

  /* =========================================================
     CRIAÇÃO — grade real de 19 penteados (recortados do atlas ao vivo) +
     paleta de 8 cores (tingidas em tempo real), estilo Ragnarok.
     ========================================================= */
  let createViewInitialized = false;
  function setupCreateView(cameFromSelect){
    document.getElementById('back-to-select-link').style.display = cameFromSelect ? 'block' : 'none';
    if(createViewInitialized) return; // listeners já ligados — só a visibilidade do link acima muda
    createViewInitialized = true;

    let gender = 'male';
    let hairStyleId = 1;
    let hairColorId = 1;
    let selectedArchetypeId = null;
    // Cor de Blusa/Calça/Bota do traje (índice na mesma COSMETIC_COLOR_PALETTE
    // de 19 cores já usada no jogo) -- pedido do jogador: escolher isso JÁ na
    // criação, do jeito Tibia de verdade, em vez de só depois via aba Cores
    // do Inventário. Índice 0 = branco/cor original do traje (ver
    // COSMETIC_COLOR_PALETTE), igual ao default de sempre.
    let bodyColorId = 0, legsColorId = 0, feetColorId = 0;

    const previewCanvas = document.getElementById('create-preview');
    function refreshPreview(){
      // outfitId (5º parâmetro) só entra quando algum arquétipo já foi
      // escolhido — antes disso o boneco aparece só com corpo+cabelo.
      drawCharacterPreview(previewCanvas, gender, hairColorId, hairStyleId, selectedArchetypeId, { head:0, body:bodyColorId, legs:legsColorId, feet:feetColorId });
    }
    scheduleRedraw(refreshPreview);

    // Grade de cor do traje -- 3 linhas (Blusa/Calça/Bota), 19 bolinhas cada
    // (mesma paleta do jogo). Só aparece depois que um Arquétipo é escolhido
    // (ver card.addEventListener mais abaixo) -- sem traje equipado não há o
    // que colorir. onPick já redesenha o retrato em tempo real.
    function buildOutfitColorRow(containerId, onPick){
      const row = document.getElementById(containerId);
      COSMETIC_COLOR_PALETTE.forEach((hex, idx)=>{
        const dot = document.createElement('div');
        dot.className = 'outfit-color-dot' + (idx===0 ? ' active' : '');
        dot.style.background = hex;
        dot.addEventListener('click', ()=>{
          row.querySelectorAll('.outfit-color-dot').forEach(d=>d.classList.remove('active'));
          dot.classList.add('active');
          onPick(idx);
          refreshPreview();
        });
        row.appendChild(dot);
      });
    }
    buildOutfitColorRow('outfit-color-body', (idx)=>{ bodyColorId = idx; });
    buildOutfitColorRow('outfit-color-legs', (idx)=>{ legsColorId = idx; });
    buildOutfitColorRow('outfit-color-feet', (idx)=>{ feetColorId = idx; });

    // Ciclador de penteado: 1 preview pequeno + setas, em vez da antiga
    // grade grande de 19 retratos (estilo Ragnarok, removida a pedido do
    // jogador) — continua usando o recorte real do atlas, tingido na cor
    // atualmente selecionada.
    const hairstylePreviewCanvas = document.getElementById('hairstyle-preview');
    const hairstyleLabel = document.getElementById('hairstyle-label');
    function refreshHairstylePreview(){
      const corCabelo = HAIR_COLOR_NAMES[hairColorId-1] || 'black';
      const head = SpriteManager.headSprite(gender, corCabelo);
      const hctx = hairstylePreviewCanvas.getContext('2d');
      hctx.clearRect(0,0,40,40);
      SpriteManager.drawHeadStyleContainFit(hctx, head, hairStyleId, 20, 34, 32, 32);
      hairstyleLabel.textContent = `${hairStyleId}/${HAIR_STYLE_COUNT}`;
    }
    scheduleRedraw(refreshHairstylePreview);
    document.getElementById('hairstyle-prev').addEventListener('click', ()=>{
      hairStyleId = hairStyleId<=1 ? HAIR_STYLE_COUNT : hairStyleId-1;
      refreshHairstylePreview();
      refreshPreview();
    });
    document.getElementById('hairstyle-next').addEventListener('click', ()=>{
      hairStyleId = hairStyleId>=HAIR_STYLE_COUNT ? 1 : hairStyleId+1;
      refreshHairstylePreview();
      refreshPreview();
    });

    // Paleta de cor: 8 bolinhas (cor aproximada só pra UI da bolinha — a arte
    // real de cada cor mora no arquivo carregado por headSprite acima).
    // Clicar troca qual arquivo é carregado pra grade inteira + o retrato.
    const colorRow = document.getElementById('hair-color-row');
    HAIR_COLOR_NAMES.forEach((name, i)=>{
      const id = i+1;
      const dot = document.createElement('div');
      dot.className = 'hair-color-dot' + (id===1?' active':'');
      dot.style.background = `rgb(${HAIR_COLOR_RGB[name].join(',')})`;
      dot.title = HAIR_COLOR_LABEL[name];
      dot.addEventListener('click', ()=>{
        hairColorId = id;
        colorRow.querySelectorAll('.hair-color-dot').forEach(d=>d.classList.remove('active'));
        dot.classList.add('active');
        refreshHairstylePreview();
        refreshPreview();
      });
      colorRow.appendChild(dot);
    });

    document.querySelectorAll('#gender-toggle .toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#gender-toggle .toggle-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        gender = btn.dataset.gender;
        refreshHairstylePreview();
        refreshPreview();
      });
    });

    document.getElementById('back-to-select-link').addEventListener('click', ()=>{
      document.getElementById('char-create-view').style.display = 'none';
      document.getElementById('char-select-view').style.display = 'block';
    });

    const ERROR_LABELS = {
      nick_invalido:'Nick precisa ter ao menos 3 caracteres.',
      genero_invalido:'Escolha um gênero válido.',
      cabelo_invalido:'Escolha uma cor de cabelo válida.',
      penteado_invalido:'Escolha um penteado válido.',
      arquetipo_invalido:'Escolha um arquétipo válido.',
      nick_em_uso:'Esse nick já está em uso — escolha outro.',
      token_invalido:'Sessão expirada. Faça login novamente.',
      erro_interno:'Erro no servidor. Tente novamente.',
      resposta_invalida:'Não foi possível falar com o servidor.',
    };

    /* =========================================================
       PASSO 2 — grade de 8 Arquétipos + painel de detalhe (pedido do
       usuário: "de uma forma que o jogador consiga verificar os detalhes de
       cada arquétipo, antes de escolher"). Clicar num card seleciona (fica
       com borda dourada), atualiza o painel de detalhe com tema/papel/magias
       reais e redesenha o retrato já vestindo o traje daquele arquétipo.
       ========================================================= */
    const archetypeGrid = document.getElementById('archetype-grid');
    const archetypeDetail = document.getElementById('archetype-detail');
    const createBtn = document.getElementById('create-btn');
    const archetypeCards = [];

    function renderArchetypeDetail(archId){
      const info = ARCHETYPE_INFO[archId];
      if(!info){
        archetypeDetail.innerHTML = `<div class="archetype-detail-empty">Clique num arquétipo pra ver os detalhes antes de escolher.</div>`;
        return;
      }
      const spellsHtml = info.spells.map(sp => `
        <div class="arch-spell-row">
          <span class="arch-spell-name">${sp.name}</span><span class="arch-spell-kind">${sp.kind}</span>
          <div class="arch-spell-desc">${sp.desc}</div>
        </div>
      `).join('');
      archetypeDetail.innerHTML = `
        <div class="arch-detail-title">${info.label} <span style="color:var(--ink-dim); font-family:var(--font-mono); font-size:11px;">— ${info.theme}</span></div>
        <div class="arch-detail-role">${info.role}</div>
        <div class="arch-detail-desc">${info.desc}</div>
        <div class="arch-detail-spells-label">Magias de destaque</div>
        ${spellsHtml}
      `;
    }

    ARCHETYPE_ID_LIST.forEach(archId=>{
      const info = ARCHETYPE_INFO[archId];
      const card = document.createElement('div');
      card.className = 'archetype-card';
      card.innerHTML = `<img src="${archetypeIconUrl(archId)}" onerror="this.style.display='none'"><div class="arch-name">${info.label}</div><div class="arch-theme">${info.theme}</div>`;
      card.addEventListener('click', ()=>{
        selectedArchetypeId = archId;
        archetypeCards.forEach(c=>c.card.classList.remove('selected'));
        card.classList.add('selected');
        renderArchetypeDetail(archId);
        document.getElementById('preview-archetype-tag').textContent = `${info.label} — ${info.theme}`;
        createBtn.disabled = false;
        document.getElementById('outfit-colors-block').style.display = 'block';
        refreshPreview();
      });
      archetypeGrid.appendChild(card);
      archetypeCards.push({ card, archId });
    });

    createBtn.addEventListener('click', async ()=>{
      const msgEl = document.getElementById('create-msg');
      msgEl.className = 'msg';
      const nick = document.getElementById('nick-input').value.trim();
      if(nick.length < 3){ msgEl.textContent = ERROR_LABELS.nick_invalido; msgEl.className='msg show error'; return; }
      if(!selectedArchetypeId){ msgEl.textContent = ERROR_LABELS.arquetipo_invalido; msgEl.className='msg show error'; return; }

      const data = await api('/api/characters/create', {
        method:'POST',
        body: JSON.stringify({ nick, gender, hairId: hairColorId, hairStyleId, archetypeId: selectedArchetypeId, bodyColorId, legsColorId, feetColorId }),
      });
      if(!data.ok){
        msgEl.textContent = ERROR_LABELS[data.error] || 'Não foi possível criar o personagem.';
        msgEl.className = 'msg show error';
        return;
      }
      msgEl.textContent = `Herói ${data.character.nick} criado! Entrando...`;
      msgEl.className = 'msg show ok';
      localStorage.setItem(LS_CHARACTER, JSON.stringify(data.character));
      setTimeout(()=>{ window.location.href = 'world-prototype.html'; }, 900);
    });
  }

  loadCharacters();
})();
</script>
