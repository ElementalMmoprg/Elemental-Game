<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Online — Seleção de Personagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-deep:#7a6435; --gold:#bfa15f; --gold-bright:#f0d38a;
    --glass-1:rgba(22,18,13,.72); --glass-2:rgba(9,7,5,.86);
    --ink:#f2e8d0; --ink-dim:#a99872; --err:#c9455a; --ok:#7fae5e;
    --font-display:'Cinzel', serif; --font-body:'Spectral', serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; font-family:var(--font-body); color:var(--ink); overflow:hidden; }
  body{
    height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 900px 600px at 25% 20%, rgba(191,161,95,.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 80% 85%, rgba(90,60,20,.10), transparent 55%),
      #050403;
  }
  .glass{
    background:linear-gradient(180deg, var(--glass-1), var(--glass-2));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--gold); border-radius:10px;
    box-shadow:0 0 0 1px rgba(191,161,95,.14) inset, 0 20px 60px rgba(0,0,0,.6);
  }
  #top-bar{ position:absolute; top:18px; left:0; right:0; display:flex; justify-content:space-between; padding:0 24px; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); }
  #top-bar b{ color:var(--gold-bright); }
  #logout-link{ color:var(--err); cursor:pointer; }

  h1.title{ font-family:var(--font-display); font-size:20px; letter-spacing:.1em; color:var(--gold-bright); text-transform:uppercase; text-align:center; margin:0 0 22px; text-shadow:0 0 14px rgba(240,211,138,.3); }

  /* ---------- Seleção de personagem (estilo Ragnarok: slots em carrossel + painel de status) ---------- */
  #char-select-view{ width:640px; padding:28px 30px; }
  .char-slots-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:20px; }
  .slot-arrow{ width:36px; height:36px; border-radius:50%; border:1px solid var(--gold-deep); background:rgba(0,0,0,.3); color:var(--gold-bright); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .slot-arrow:hover{ border-color:var(--gold-bright); }
  .slot-arrow:disabled{ opacity:.25; cursor:not-allowed; }
  .char-slots{ display:flex; gap:12px; }
  .char-slot{
    width:110px; height:150px; border-radius:8px; border:1px solid var(--gold-deep);
    background:radial-gradient(ellipse at 50% 30%,#201808,#0a0704 75%); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative;
    transition:border-color .15s, transform .15s; opacity:.6;
  }
  .char-slot:hover{ opacity:.85; }
  .char-slot.selected{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright) inset, 0 0 14px rgba(240,211,138,.25); opacity:1; transform:translateY(-4px); }
  .char-slot .select-tag{ position:absolute; top:6px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:var(--gold-bright); background:rgba(0,0,0,.5); padding:2px 7px; border-radius:9px; display:none; }
  .char-slot.selected .select-tag{ display:block; }
  .char-slot .slot-nick{ font-family:var(--font-display); font-size:11.5px; color:var(--ink); padding:5px 0; text-align:center; width:100%; background:rgba(0,0,0,.35); }
  .char-slot.empty{ cursor:default; display:flex; align-items:center; justify-content:center; opacity:.35; }
  .char-slot.empty .plus{ font-size:26px; color:var(--ink-dim); }

  .status-panel{ display:flex; gap:0; border:1px solid var(--gold-deep); border-radius:8px; overflow:hidden; background:rgba(0,0,0,.22); }
  .status-col{ flex:1; padding:12px 16px; }
  .status-col + .status-col{ border-left:1px solid rgba(191,161,95,.25); }
  .status-row{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; padding:3px 0; }
  .status-row span:first-child{ color:var(--ink-dim); }
  .status-row span:last-child{ color:var(--gold-bright); }
  .status-row.big span:last-child{ font-family:var(--font-display); font-size:14px; color:var(--gold-bright); }

  #connect-btn{
    width:100%; margin-top:16px; padding:13px; border-radius:6px; border:1px solid var(--gold-bright);
    background:linear-gradient(180deg,#4a3a1e,#2c2115); color:var(--gold-bright); font-family:var(--font-display);
    font-size:14px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  #connect-btn:hover{ filter:brightness(1.15); }
  #connect-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #new-char-link{ display:block; text-align:center; margin-top:12px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
  #new-char-link:hover{ color:var(--gold-bright); }

  /* ---------- Criação de personagem (estilo Ragnarok: grade de penteados + paleta de cor) ---------- */
  #char-create-view{ width:640px; padding:26px 30px; display:none; }
  .create-layout{ display:flex; gap:22px; }
  .create-left{ width:170px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:12px; }
  #create-preview{ width:150px; height:190px; background:radial-gradient(ellipse at 50% 30%,#201808,#0a0704 75%); border:1px solid var(--gold-deep); border-radius:8px; }
  .toggle-row{ display:flex; gap:8px; width:100%; }
  .toggle-btn{
    flex:1; padding:9px; text-align:center; border-radius:6px; border:1px solid var(--gold-deep);
    background:rgba(0,0,0,.3); color:var(--ink-dim); font-family:var(--font-display); font-size:11px;
    letter-spacing:.04em; cursor:pointer; text-transform:uppercase;
  }
  .toggle-btn.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:rgba(191,161,95,.12); box-shadow:0 0 10px rgba(240,211,138,.2); }
  .field{ width:100%; }
  .field label{ display:block; font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-bottom:5px; letter-spacing:.03em; }
  .field input{
    width:100%; background:#140f0a; border:1px solid #3a2f1f; border-radius:5px; color:var(--ink);
    padding:9px 10px; font-family:var(--font-body); font-size:13px; outline:none;
  }
  .field input:focus{ border-color:var(--gold-bright); }

  .create-right{ flex:1; min-width:0; }
  .section-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em; margin:0 0 7px; text-transform:uppercase; }
  #hair-style-grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:7px; max-height:198px; overflow-y:auto;
    padding:3px; margin-bottom:14px;
  }
  .hair-style-cell{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--gold-deep); background:rgba(0,0,0,.3);
    cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .hair-style-cell canvas{ image-rendering:pixelated; }
  .hair-style-cell:hover{ border-color:var(--gold-bright); }
  .hair-style-cell.active{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright) inset, 0 0 8px rgba(240,211,138,.3); }
  #hair-color-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .hair-color-dot{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .hair-color-dot.active{ border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright), 0 0 8px rgba(240,211,138,.5); }

  #create-btn{
    width:100%; margin-top:6px; padding:13px; border-radius:6px; border:1px solid var(--gold-bright);
    background:linear-gradient(180deg,#4a3a1e,#2c2115); color:var(--gold-bright); font-family:var(--font-display);
    font-size:14px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  #create-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #back-to-select-link{ display:block; text-align:center; margin-top:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; }
  #back-to-select-link:hover{ color:var(--gold-bright); }

  .msg{ font-family:var(--font-mono); font-size:11.5px; padding:9px 10px; border-radius:5px; margin-bottom:14px; display:none; }
  .msg.show{ display:block; }
  .msg.error{ background:rgba(201,69,90,.12); border:1px solid var(--err); color:#ef9aa5; }
  .msg.ok{ background:rgba(127,174,94,.12); border:1px solid var(--ok); color:#b9dba0; }

  #loading-view{ font-family:var(--font-mono); color:var(--ink-dim); font-size:12px; }
</style>
</head>
<body>

<div id="top-bar">
  <span>Conta: <b id="account-name">—</b></span>
  <span id="logout-link">Sair</span>
</div>

<div id="loading-view">Carregando personagens...</div>

<!-- TEM PERSONAGEM: carrossel de slots + painel de status, estilo Ragnarok -->
<div id="char-select-view" class="glass" style="display:none;">
  <h1 class="title">Seleção de Personagem</h1>
  <div class="char-slots-row">
    <button class="slot-arrow" id="slots-prev">◀</button>
    <div class="char-slots" id="char-slots"></div>
    <button class="slot-arrow" id="slots-next">▶</button>
  </div>
  <div class="status-panel" id="status-panel"></div>
  <button id="connect-btn" disabled>Conectar</button>
  <div id="new-char-link">+ Criar novo herói</div>
</div>

<!-- SEM PERSONAGEM (ou criando um novo): grade de penteados + paleta de cor, estilo Ragnarok -->
<div id="char-create-view" class="glass">
  <h1 class="title">Criação de Personagem</h1>
  <div class="msg" id="create-msg"></div>

  <div class="create-layout">
    <div class="create-left">
      <canvas id="create-preview" width="150" height="190"></canvas>
      <div class="toggle-row" id="gender-toggle">
        <div class="toggle-btn active" data-gender="male">♂ Masc.</div>
        <div class="toggle-btn" data-gender="female">♀ Fem.</div>
      </div>
      <div class="field">
        <label>Nick (apelido único do herói)</label>
        <input type="text" id="nick-input" maxlength="20" placeholder="Ex: Kael">
      </div>
    </div>
    <div class="create-right">
      <div class="section-label">Penteado</div>
      <div id="hair-style-grid"></div>
      <div class="section-label">Cor do Cabelo</div>
      <div id="hair-color-row"></div>
      <button id="create-btn">Criar Personagem</button>
      <div id="back-to-select-link" style="display:none;">← Voltar pra seleção</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // Backend oficial no Render — fixo, não detectado por location.origin.
  const API_BASE = 'https://elemental-server.onrender.com';
  // Repositório oficial de artes/sprites no GitHub Pages — fixo character by character.
  const URL_BASE = 'https://elementalmmoprg.github.io/Elemental_assets/assets/';

  const LS_TOKEN = 'elemental_token';
  const LS_USERNAME = 'elemental_username';
  const LS_CHARACTER = 'elemental_character';

  const token = localStorage.getItem(LS_TOKEN);
  const username = localStorage.getItem(LS_USERNAME);
  if(!token || !username){ window.location.href = 'index.html'; return; }
  document.getElementById('account-name').textContent = username;

  document.getElementById('logout-link').addEventListener('click', ()=>{
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USERNAME);
    localStorage.removeItem(LS_CHARACTER);
    window.location.href = 'index.html';
  });

  async function api(path, opts={}){
    const res = await fetch(API_BASE+path, {
      ...opts,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, ...(opts.headers||{}) },
    });
    let data; try{ data = await res.json(); }catch(e){ data = { ok:false, error:'resposta_invalida' }; }
    return data;
  }

  /* =========================================================
     SPRITE MANAGER — mesma técnica de world-prototype.html (mirror
     reduzido: só corpo + cabeça, é tudo que essa tela precisa).
     ver comentários grandões lá pra explicação completa de cada peça.
     ========================================================= */
  // 8 cores "lógicas" (mirror de huntEngine.HAIR_COLORS) e 19 penteados reais
  // (mirror de huntEngine.HAIR_STYLE_COUNT — linhas do atlas heads */black.png).
  const HAIR_COLOR_NAMES = ['black','blue','brown','green','purple','red','white','yellow'];
  const HAIR_COLOR_RGB = { black:[42,33,24], blue:[58,95,160], brown:[138,90,42], green:[63,155,74], purple:[122,63,160], red:[201,64,64], white:[232,226,208], yellow:[216,194,58] };
  const HAIR_COLOR_LABEL = { black:'Preto', blue:'Azul', brown:'Castanho', green:'Verde', purple:'Roxo', red:'Vermelho', white:'Branco', yellow:'Loiro' };
  const HAIR_STYLE_COUNT = 19;

  const SpriteManager = (function(){
    const cache = {};
    function computeAutoFrame(img){
      try{
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h) return null;
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const cx = c.getContext('2d'); cx.drawImage(img,0,0);
        const data = cx.getImageData(0,0,w,h).data;
        function isBg(x,y){ const i=(y*w+x)*4, a=data[i+3]; if(a<10) return true; const r=data[i],g=data[i+1],b=data[i+2]; return (r>235&&g>235&&b>235); }
        function rowHas(y,x0,x1){ for(let x=x0;x<x1;x++){ if(!isBg(x,y)) return true; } return false; }
        function colHas(x,y0,y1){ for(let y=y0;y<y1;y++){ if(!isBg(x,y)) return true; } return false; }
        let y0=-1; for(let y=0;y<h;y++){ if(rowHas(y,0,w)){ y0=y; break; } }
        if(y0<0) return null;
        let y1=y0; for(let y=y0;y<h;y++){ if(rowHas(y,0,w)) y1=y; else break; } y1++;
        let x0=-1; for(let x=0;x<w;x++){ if(colHas(x,y0,y1)){ x0=x; break; } }
        if(x0<0) return null;
        let x1=x0; for(let x=x0;x<w;x++){ if(colHas(x,y0,y1)) x1=x; else break; } x1++;
        const pad=3, sx=Math.max(0,x0-pad), sy=Math.max(0,y0-pad);
        return { sx, sy, sw:Math.min(w-sx,(x1-x0)+pad*2), sh:Math.min(h-sy,(y1-y0)+pad*2) };
      }catch(e){ return null; }
    }
    function computeHeadStyleFrames(img){
      try{
        const w = img.naturalWidth, h = img.naturalHeight;
        if(!w||!h) return [];
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const cx = c.getContext('2d'); cx.drawImage(img,0,0);
        const data = cx.getImageData(0,0,w,h).data;
        function isBg(x,y){ const i=(y*w+x)*4, a=data[i+3]; if(a<10) return true; const r=data[i],g=data[i+1],b=data[i+2]; return (r>235&&g>235&&b>235); }
        function rowHas(y){ for(let x=0;x<w;x++){ if(!isBg(x,y)) return true; } return false; }
        function colHas(x,y0,y1){ for(let y=y0;y<y1;y++){ if(!isBg(x,y)) return true; } return false; }
        const bands=[]; let y=0;
        while(y<h){ if(rowHas(y)){ const y0=y; let y1=y; while(y1<h && rowHas(y1)) y1++; bands.push([y0,y1]); y=y1; } else y++; }
        const pad=3;
        return bands.map(([y0,y1])=>{
          let x0=-1; for(let x=0;x<w;x++){ if(colHas(x,y0,y1)){ x0=x; break; } }
          if(x0<0) return null;
          let x1=x0; for(let x=x0;x<w;x++){ if(colHas(x,y0,y1)) x1=x; else break; } x1++;
          const sx=Math.max(0,x0-pad), sy=Math.max(0,y0-pad);
          return { sx, sy, sw:Math.min(w-sx,(x1-x0)+pad*2), sh:Math.min(h-sy,(y1-y0)+pad*2) };
        }).filter(Boolean);
      }catch(e){ return []; }
    }
    function load(key, relPath){
      if(cache[key]) return cache[key];
      const entry = { img:new Image(), loaded:false, failed:false, frame:null, styleFrames:null };
      entry.img.crossOrigin = 'anonymous';
      entry.img.onload = ()=>{ entry.loaded=true; entry.frame=computeAutoFrame(entry.img); if(key.indexOf('h_')===0) entry.styleFrames=computeHeadStyleFrames(entry.img); };
      entry.img.onerror = ()=> entry.failed = true;
      entry.img.src = URL_BASE + relPath;
      cache[key] = entry;
      return entry;
    }
    function bodySprite(gender){ return load('b_'+gender, `player/bodies ${gender}/${gender}_base.png`); }
    // Só existe "heads male/black.png" no repositório hoje — não existe
    // "heads female/*" nenhum ainda. Pra feminino, isso 404 até esse arquivo
    // ser adicionado (de propósito não reaproveitamos a cabeça masculina).
    function headSprite(gender){ return load('h_'+gender, `player/heads ${gender}/black.png`); }
    function getHeadStyleFrame(entry, styleId){
      if(!entry.loaded) return null;
      const frames = entry.styleFrames;
      if(!frames || !frames.length) return entry.frame;
      const idx = ((Math.floor(Number(styleId)||1)-1) % frames.length + frames.length) % frames.length;
      return frames[idx];
    }
    const tintCache = {};
    function getTintedHeadCanvas(entry, styleId, colorName){
      const frame = getHeadStyleFrame(entry, styleId);
      if(!frame) return null;
      const key = entry.img.src+'|'+styleId+'|'+colorName;
      if(tintCache[key]) return tintCache[key];
      const c = document.createElement('canvas'); c.width=frame.sw; c.height=frame.sh;
      const cctx = c.getContext('2d');
      cctx.drawImage(entry.img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, frame.sw, frame.sh);
      const rgb = HAIR_COLOR_RGB[colorName] || HAIR_COLOR_RGB.black;
      if(colorName !== 'black'){
        const imgData = cctx.getImageData(0,0,frame.sw,frame.sh);
        const d = imgData.data;
        for(let i=0;i<d.length;i+=4){
          if(d[i+3]===0) continue;
          const lum = (0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
          const factor = Math.min(1.6, 0.35+1.3*lum*(1-0.35));
          d[i]=Math.min(255,rgb[0]*factor); d[i+1]=Math.min(255,rgb[1]*factor); d[i+2]=Math.min(255,rgb[2]*factor);
        }
        cctx.putImageData(imgData,0,0);
      }
      const result = { canvas:c, sw:frame.sw, sh:frame.sh };
      tintCache[key] = result;
      return result;
    }
    function drawFrameContainFit(targetCtx, entry, cx, bottomY, maxW, maxH){
      if(!entry.loaded || !entry.frame) return null;
      const f = entry.frame;
      const scale = Math.min(maxW/f.sw, maxH/f.sh);
      const dw=f.sw*scale, dh=f.sh*scale, dx=cx-dw/2, dy=bottomY-dh;
      targetCtx.drawImage(entry.img, f.sx, f.sy, f.sw, f.sh, dx, dy, dw, dh);
      return { dw, dh, dx, dy, topY:dy };
    }
    function drawHeadStyleContainFit(targetCtx, entry, styleId, colorName, cx, bottomY, maxW, maxH){
      if(!entry.loaded) return null;
      const tinted = getTintedHeadCanvas(entry, styleId, colorName);
      if(!tinted) return null;
      const scale = Math.min(maxW/tinted.sw, maxH/tinted.sh);
      const dw=tinted.sw*scale, dh=tinted.sh*scale, dx=cx-dw/2, dy=bottomY-dh;
      targetCtx.drawImage(tinted.canvas, 0, 0, tinted.sw, tinted.sh, dx, dy, dw, dh);
      return { dw, dh, dx, dy, topY:dy };
    }
    return { bodySprite, headSprite, getHeadStyleFrame, getTintedHeadCanvas, drawFrameContainFit, drawHeadStyleContainFit };
  })();

  // Composita corpo+cabeça num canvas qualquer (retrato da criação, thumbnail
  // do slot de seleção, etc.) — mesma lógica de drawCharacterLayers do
  // world-prototype.html, só sem outfit/asa/aura (não existem antes de entrar
  // no mundo). Cai num boneco procedural simples se o sprite ainda não
  // carregou/não existe (ex.: cabeça feminina, ver comentário em headSprite).
  function drawCharacterPreview(canvas, gender, hairColorId, hairStyleId){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, feetY = h-14;
    ctx.beginPath(); ctx.ellipse(cx, feetY+6, w*0.22, 5, 0,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fill();
    const body = SpriteManager.bodySprite(gender);
    const bodyDraw = SpriteManager.drawFrameContainFit(ctx, body, cx, feetY, w*0.34, h*0.46);
    const corCabelo = HAIR_COLOR_NAMES[(Number(hairColorId)||1)-1] || 'black';
    const head = SpriteManager.headSprite(gender);
    const headBottomY = (bodyDraw ? bodyDraw.topY : feetY - h*0.30) + h*0.045;
    const headDraw = SpriteManager.drawHeadStyleContainFit(ctx, head, hairStyleId||1, corCabelo, cx, headBottomY, w*0.26, w*0.26);
    if(!bodyDraw){
      ctx.fillStyle = gender==='female' ? '#8a4a6a' : '#5a6b8a';
      ctx.fillRect(cx-w*0.1, feetY-h*0.32, w*0.2, h*0.2);
      ctx.fillRect(cx-w*0.08, feetY-h*0.14, w*0.06,h*0.14); ctx.fillRect(cx+w*0.02, feetY-h*0.14, w*0.06,h*0.14);
    }
    if(!headDraw){
      ctx.beginPath(); ctx.arc(cx, headBottomY - w*0.09, w*0.09, 0, Math.PI*2); ctx.fillStyle='#e0b98a'; ctx.fill();
      ctx.fillStyle = HAIR_COLOR_RGB[corCabelo] ? `rgb(${HAIR_COLOR_RGB[corCabelo].join(',')})` : '#2a2118';
      ctx.beginPath(); ctx.arc(cx, headBottomY - w*0.11, w*0.095, Math.PI, Math.PI*2); ctx.fill();
    }
  }
  // Redesenha qualquer canvas que ainda dependa de um sprite que não tinha
  // carregado a tempo do primeiro desenho (load() é assíncrono) — cada
  // chamador registra sua própria função de redesenho aqui.
  const pendingRedraws = [];
  function scheduleRedraw(fn){ pendingRedraws.push(fn); }
  setInterval(()=>{ pendingRedraws.forEach(fn=>fn()); }, 300);

  /* =========================================================
     CARREGA OS PERSONAGENS DA CONTA
     ========================================================= */
  async function loadCharacters(){
    const data = await api('/api/characters');
    document.getElementById('loading-view').style.display = 'none';
    if(!data.ok || !data.characters || data.characters.length === 0){
      document.getElementById('char-create-view').style.display = 'block';
      setupCreateView(false);
      return;
    }
    setupSelectView(data.characters);
  }

  /* =========================================================
     SELEÇÃO — carrossel de slots (estilo Ragnarok) + painel de status
     ========================================================= */
  function setupSelectView(characters){
    const view = document.getElementById('char-select-view');
    view.style.display = 'block';
    const slotsWrap = document.getElementById('char-slots');
    const statusPanel = document.getElementById('status-panel');
    const VISIBLE = 3;
    let windowStart = 0;
    let selectedIdx = 0;

    function fmtPct(cur, max){ return max ? Math.round(cur/max*100) : 0; }

    function renderStatus(c){
      const p = c.progress || {};
      const stars = (p.prestige && (p.prestige.bronzeStars+p.prestige.silverStars+p.prestige.goldStars)) || 0;
      statusPanel.innerHTML = `
        <div class="status-col">
          <div class="status-row big"><span>Nome</span><span>${c.nick}</span></div>
          <div class="status-row"><span>Gênero</span><span>${c.gender==='female'?'Feminino':'Masculino'}</span></div>
          <div class="status-row"><span>Nível</span><span>${c.level||1}</span></div>
          <div class="status-row"><span>Estrelas</span><span>${'★'.repeat(stars)||'—'}</span></div>
        </div>
        <div class="status-col">
          <div class="status-row"><span>HP</span><span>${p.hp!=null?`${Math.floor(p.hp)}/${p.hpMax}`:'—'}</span></div>
          <div class="status-row"><span>MP</span><span>${p.mp!=null?`${Math.floor(p.mp)}/${p.mpMax}`:'—'}</span></div>
          <div class="status-row"><span>Gold</span><span>${p.gold!=null?p.gold.toLocaleString('pt-BR'):'—'}</span></div>
          <div class="status-row"><span>XP</span><span>${p.xp!=null?p.xp.toLocaleString('pt-BR'):'—'}</span></div>
        </div>
      `;
    }

    function renderSlots(){
      slotsWrap.innerHTML = '';
      const visibleChars = characters.slice(windowStart, windowStart+VISIBLE);
      visibleChars.forEach((c, i)=>{
        const realIdx = windowStart+i;
        const slot = document.createElement('div');
        slot.className = 'char-slot' + (realIdx===selectedIdx ? ' selected' : '');
        slot.innerHTML = `<span class="select-tag">Select</span><canvas width="90" height="115"></canvas><div class="slot-nick">${c.nick}</div>`;
        slot.addEventListener('click', ()=>{ selectedIdx = realIdx; renderSlots(); renderStatus(characters[selectedIdx]); });
        slotsWrap.appendChild(slot);
        const canvas = slot.querySelector('canvas');
        const draw = ()=> drawCharacterPreview(canvas, c.gender, c.hairId, c.hairStyleId);
        draw(); scheduleRedraw(draw);
      });
      // preenche slots vazios até completar VISIBLE, igual à referência (3 caixas fixas)
      for(let i=visibleChars.length; i<VISIBLE; i++){
        const slot = document.createElement('div');
        slot.className = 'char-slot empty';
        slot.innerHTML = `<span class="plus">+</span>`;
        slotsWrap.appendChild(slot);
      }
      document.getElementById('slots-prev').disabled = windowStart <= 0;
      document.getElementById('slots-next').disabled = windowStart+VISIBLE >= characters.length;
    }

    document.getElementById('slots-prev').addEventListener('click', ()=>{ windowStart = Math.max(0, windowStart-VISIBLE); renderSlots(); });
    document.getElementById('slots-next').addEventListener('click', ()=>{ if(windowStart+VISIBLE < characters.length){ windowStart += VISIBLE; renderSlots(); } });

    renderSlots();
    renderStatus(characters[selectedIdx]);

    document.getElementById('connect-btn').disabled = false;
    document.getElementById('connect-btn').addEventListener('click', ()=>{
      localStorage.setItem(LS_CHARACTER, JSON.stringify(characters[selectedIdx]));
      window.location.href = 'world-prototype.html';
    });
    document.getElementById('new-char-link').addEventListener('click', ()=>{
      view.style.display = 'none';
      document.getElementById('char-create-view').style.display = 'block';
      document.getElementById('back-to-select-link').style.display = 'block';
      setupCreateView(true);
    });
  }

  /* =========================================================
     CRIAÇÃO — grade real de 19 penteados (recortados do atlas ao vivo) +
     paleta de 8 cores (tingidas em tempo real), estilo Ragnarok.
     ========================================================= */
  let createViewInitialized = false;
  function setupCreateView(cameFromSelect){
    document.getElementById('back-to-select-link').style.display = cameFromSelect ? 'block' : 'none';
    if(createViewInitialized) return; // listeners já ligados — só a visibilidade muda ao ir/voltar
    createViewInitialized = true;

    let gender = 'male';
    let hairStyleId = 1;
    let hairColorId = 1;

    const previewCanvas = document.getElementById('create-preview');
    function refreshPreview(){
      drawCharacterPreview(previewCanvas, gender, hairColorId, hairStyleId);
    }
    scheduleRedraw(refreshPreview);

    // Grade de penteados: 1 canvas por estilo (1-19), mostrando o recorte
    // real do atlas já tingido na cor atualmente selecionada — clicar troca
    // o penteado escolhido.
    const grid = document.getElementById('hair-style-grid');
    const styleCells = [];
    for(let styleId=1; styleId<=HAIR_STYLE_COUNT; styleId++){
      const cell = document.createElement('div');
      cell.className = 'hair-style-cell' + (styleId===1?' active':'');
      const c = document.createElement('canvas'); c.width=40; c.height=40;
      cell.appendChild(c);
      cell.addEventListener('click', ()=>{
        hairStyleId = styleId;
        styleCells.forEach(x=>x.cell.classList.remove('active'));
        cell.classList.add('active');
        refreshPreview();
      });
      grid.appendChild(cell);
      styleCells.push({ cell, canvas:c, styleId });
    }
    function refreshStyleGrid(){
      const head = SpriteManager.headSprite(gender);
      const corCabelo = HAIR_COLOR_NAMES[hairColorId-1] || 'black';
      styleCells.forEach(({canvas, styleId})=>{
        const cctx = canvas.getContext('2d');
        cctx.clearRect(0,0,40,40);
        SpriteManager.drawHeadStyleContainFit(cctx, head, styleId, corCabelo, 20, 34, 32, 32);
      });
    }
    scheduleRedraw(refreshStyleGrid);

    // Paleta de cor: 8 bolinhas na cor de destino (RGB real usado no
    // tingimento) — clicar re-tinge a grade inteira + o retrato.
    const colorRow = document.getElementById('hair-color-row');
    HAIR_COLOR_NAMES.forEach((name, i)=>{
      const id = i+1;
      const dot = document.createElement('div');
      dot.className = 'hair-color-dot' + (id===1?' active':'');
      dot.style.background = `rgb(${HAIR_COLOR_RGB[name].join(',')})`;
      dot.title = HAIR_COLOR_LABEL[name];
      dot.addEventListener('click', ()=>{
        hairColorId = id;
        colorRow.querySelectorAll('.hair-color-dot').forEach(d=>d.classList.remove('active'));
        dot.classList.add('active');
        refreshStyleGrid();
        refreshPreview();
      });
      colorRow.appendChild(dot);
    });

    document.querySelectorAll('#gender-toggle .toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#gender-toggle .toggle-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        gender = btn.dataset.gender;
        refreshStyleGrid();
        refreshPreview();
      });
    });

    document.getElementById('back-to-select-link').addEventListener('click', ()=>{
      document.getElementById('char-create-view').style.display = 'none';
      document.getElementById('char-select-view').style.display = 'block';
    });

    const ERROR_LABELS = {
      nick_invalido:'Nick precisa ter ao menos 3 caracteres.',
      genero_invalido:'Escolha um gênero válido.',
      cabelo_invalido:'Escolha uma cor de cabelo válida.',
      penteado_invalido:'Escolha um penteado válido.',
      nick_em_uso:'Esse nick já está em uso — escolha outro.',
      token_invalido:'Sessão expirada. Faça login novamente.',
      erro_interno:'Erro no servidor. Tente novamente.',
      resposta_invalida:'Não foi possível falar com o servidor.',
    };

    document.getElementById('create-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('create-msg');
      msgEl.className = 'msg';
      const nick = document.getElementById('nick-input').value.trim();
      if(nick.length < 3){ msgEl.textContent = ERROR_LABELS.nick_invalido; msgEl.className='msg show error'; return; }

      const data = await api('/api/characters/create', {
        method:'POST',
        body: JSON.stringify({ nick, gender, hairId: hairColorId, hairStyleId }),
      });
      if(!data.ok){
        msgEl.textContent = ERROR_LABELS[data.error] || 'Não foi possível criar o personagem.';
        msgEl.className = 'msg show error';
        return;
      }
      msgEl.textContent = `Herói ${data.character.nick} criado! Entrando...`;
      msgEl.className = 'msg show ok';
      localStorage.setItem(LS_CHARACTER, JSON.stringify(data.character));
      setTimeout(()=>{ window.location.href = 'world-prototype.html'; }, 900);
    });
  }

  loadCharacters();
})();
</script>
</body>
</html>
